name: Verify
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: routier_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: routier_workflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://routier_test:test_password@127.0.0.1:5432/routier_workflow_test
      DIRECT_URL: postgresql://routier_test:test_password@127.0.0.1:5432/routier_workflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run prisma:generate
      - run: bun run db:migrate:deploy
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run desktop:build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
